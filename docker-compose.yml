services:
  studysync:
    build:
      context: .
      dockerfile: Dockerfile
    image: studysync:latest
    container_name: studysync-prod
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/studysync.db
      - JWT_SECRET=${JWT_SECRET:-changeme_in_production_jwt_secret}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-StudySync <noreply@studysync.internal>}
    volumes:
      - studysync-data:/app/data
      - studysync-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  studysync-data:
    name: studysync-data
  studysync-uploads:
    name: studysync-uploads
